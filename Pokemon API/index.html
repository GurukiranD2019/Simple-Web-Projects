<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Sprite Generator</title>
    <link
      rel="stylesheet"
      href="style.css
    "
    />
  </head>
  <body>
    <div class="container">
      <h1 style="text-align: center">Pokemon Sprite Generator</h1>
      <h5 style="text-align: center">Type specific pokemon name and try!</h4>
      <div class="forms">
        <input type="text" id="pokemonName" placeholder="Enter Pokemon name" />
        <br />
        <br />
        <button onclick="fetchData()" class="submit-btn">Fetch Pokemon</button>
        <br />
        <br />
        <img
          class="pokemon"
          src=""
          alt="Pokemon Sprite will be displayed please wait"
          id="pokemonSprite"
          style="display: none;"
        />
        <br>
        <button class="submit-btn">
          <a href="https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.pokemon.com/us/pokedex&ved=2ahUKEwjKyIirlseJAxVxUGwGHWwFGzMQFnoECBwQAQ&usg=AOvVaw0YuGYdWxhkhnfIIbHHjJXg"
          style="text-decoration: none; color: aliceblue;">

          List of Pokemons
        </a> 
        </button>

      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
